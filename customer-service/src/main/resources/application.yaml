server:
  port: 8086

spring:
  application:
    name: customer-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:saga-ecommerce}/protocol/openid-connect/certs"

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5437/customer_db
    username: postgres
    password: admin
    url: "${CUSTOMER_DATABASE_URL:jdbc:postgresql://localhost:5437/customer_db}"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: true

keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:saga-ecommerce}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
  username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  password: ${KEYCLOAK_PASSWORD:admin}
  client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
