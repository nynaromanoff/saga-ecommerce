server:
  port: 8082

spring:
  application:
    name: order-service

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: "${ORDER_DATABASE_URL:jdbc:postgresql://localhost:5433/order_db}"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:saga}
    password: ${RABBITMQ_PASSWORD:saga_local_dev}
    connection-timeout: 10000ms
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
