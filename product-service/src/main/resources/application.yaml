server:
  port: 8085

spring:
  application:
    name: product-service
  profiles:
    active: local

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:saga-ecommerce}/protocol/openid-connect/certs"

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:saga}
    password: ${RABBITMQ_PASSWORD:saga_local_dev}

  datasource:
    url: "${PRODUCT_DATABASE_URL:jdbc:postgresql://localhost:5436/product_db}"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  s3:
    bucket-name: ${AWS_S3_BUCKET:saga-ecommerce-products}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
