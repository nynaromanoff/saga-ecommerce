server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${FRONTEND_ORIGIN:http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: product-service
          uri: "${PRODUCT_SERVICE_URL:http://localhost:8085}"
          predicates:
            - Path=/api/v1/products/**

        - id: customer-service
          uri: "${CUSTOMER_SERVICE_URL:http://localhost:8086}"
          predicates:
            - Path=/api/v1/customers/**
