server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: order-service
        - uri: http://localhost:8081
        - predicates:
          - Path=/api/v1/orders/**

        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/payments/**

        - id: invetory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/invetorys/**

        - id: product-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/products/**

        - id: customer-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/customers/**

