server:
  port: 8086

spring:
  application:
    name: customer-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/realms/saga-ecommerce/protocol/openid-connect/certs

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5437/customer_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: true

keycloak:
  server-url: http://localhost:8081
  realm: saga-ecommerce
  admin-realm: master
  username: admin
  password: ${KEYCLOAK_PASSWORD}
  client-id: admin-cli
